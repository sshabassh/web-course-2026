<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Says</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <main class="game-container">
        <h1>Simon Says</h1>
        
        <div class="status-panel">
            <div class="level">Уровень: <span id="level-display">0</span></div>
            <div class="status-text" id="status-text">Нажмите «Старт» для начала</div>
        </div>

        <!-- Игровое поле 2x2 -->
        <div class="game-board">
            <!-- data-id используется для привязки к индексу в массиве -->
            <button class="simon-btn btn-0" data-id="0"></button>
            <button class="simon-btn btn-1" data-id="1"></button>
            <button class="simon-btn btn-2" data-id="2"></button>
            <button class="simon-btn btn-3" data-id="3"></button>
        </div>

        <button id="start-btn" class="start-btn">Старт</button>
    </main>

</body>
</html>
