<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List | Лабораторная 3</title>
    <link rel="stylesheet" href="style.css">
    <!-- Подключаем скрипт с атрибутом defer (требование) -->
    <script src="script.js" defer></script>
</head>
<body>

    <main class="app-container">
        <h1>Мои задачи</h1>

        <!-- Блок добавления задачи -->
        <section class="input-section">
            <input type="text" id="task-input" placeholder="Что нужно сделать?" autocomplete="off">
            <button id="add-btn">Добавить</button>
        </section>
        <p id="error-msg" class="error-msg">Поле не может быть пустым!</p>

        <!-- Панель управления (Фильтры и Счётчик) -->
        <section class="controls-section">
            <div class="filters" id="filters">
                <button class="filter-btn active" data-filter="all">Все</button>
                <button class="filter-btn" data-filter="active">Активные</button>
                <button class="filter-btn" data-filter="completed">Завершённые</button>
            </div>
            <div class="counter" id="counter">
                Осталось: <span id="count-active">0</span>, Выполнено: <span id="count-completed">0</span>
            </div>
        </section>

        <!-- Контейнер для списка задач (генерируется в JS) -->
        <ul id="task-list" class="task-list">
            <!-- Сюда будут добавляться <li> через JavaScript -->
        </ul>
    </main>

</body>
</html>
